# Build installable desktop packages on version tags.
name: Build installers
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
          - os: ubuntu-latest
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # vendor/ is git-ignored, so download the offline libraries before packaging.
      - name: Fetch offline libraries
        run: python fetch_libs.py

      - name: Check vendor files
        shell: bash
        run: |
          for f in tex-svg.js jspdf.umd.min.js pdf.min.js pdf.worker.min.js; do
            test -s "vendor/$f" || { echo "missing vendor/$f"; exit 1; }
          done

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match package.json version $PKG"; exit 1
          fi

      # rpm target needs rpmbuild on Linux
      - name: Install rpm tooling (Linux)
        if: matrix.label == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npm ci

      # Every OS: bundle Tesseract.js + English data as an extra resource (the only offline handwriting engine).
      - name: Prepare bundled OCR
        shell: bash
        run: |
          python fetch_libs.py
          (cd ocr-engine && npm install --omit=dev)
          npm run test:ocr

      - name: Check OCR folder has no links
        shell: bash
        run: |
          du -sh ocr-engine/node_modules ocr-engine/tessdata
          LINKS=$(find ocr-engine/node_modules -path ocr-engine/node_modules/.bin -prune -o -type l -print)
          if [ -n "$LINKS" ]; then echo "Unexpected links in ocr-engine/node_modules:"; echo "$LINKS"; exit 1; fi

      - name: Build and publish installers (tag build)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No code-signing certificates: skip auto-discovery so the macOS build does not fail/hang.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build installers (manual non-tag build)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify update metadata and artifact names (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          case "${{ matrix.label }}" in
            windows) META=latest.yml ;;
            macos) META=latest-mac.yml ;;
            linux) META=latest-linux.yml ;;
          esac
          test -s "dist/$META" || { echo "Missing dist/$META"; exit 1; }
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const yaml = require('js-yaml');
          const metaName = process.env.META || ({windows:'latest.yml',macos:'latest-mac.yml',linux:'latest-linux.yml'})[process.env.PLATFORM];
          const meta = yaml.load(fs.readFileSync(path.join('dist', metaName), 'utf8'));
          const files = Array.isArray(meta.files) ? meta.files : (meta.path ? [{url: meta.path}] : []);
          if (!files.length) throw new Error(`${metaName} contains no downloadable file entries`);
          for (const item of files) {
            const name = path.basename(item.url || item.path || '');
            if (!name || !fs.existsSync(path.join('dist', name))) throw new Error(`${metaName} references missing artifact: ${name}`);
            if (/\.(exe|AppImage|zip)$/i.test(name) && !fs.existsSync(path.join('dist', name + '.blockmap'))) {
              throw new Error(`Missing differential blockmap for ${name}`);
            }
            console.log(`${metaName}: ${name}`);
          }
          NODE
        env:
          PLATFORM: ${{ matrix.label }}

      - name: Verify bundled OCR is inside the package
        shell: bash
        run: |
          DIRS=$(find dist -type d \( -path '*-unpacked/resources' -o -path '*/RejBoard.app/Contents/Resources' \))
          test -n "$DIRS" || { echo "no packaged resources folder found"; exit 1; }
          for RES in $DIRS; do
            echo "checking $RES"
            test -f "$RES/ocr/node_modules/tesseract.js/package.json"
            test -s "$RES/ocr/tessdata/eng.traineddata"
          done

  release-notes:
    name: Update release notes
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog for this version
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/{f=0} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "No CHANGELOG.md section for $VER"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: false
