# Native apps: shared Kotlin core tests (mingwX64) + the WinUI 3 / Direct2D app as an MSIX.
# Runs only when the native apps change. The MSIX is "RejBoard Native (preview)" (com.rejwan.rejboard.native): it installs next to
# the Electron RejBoard without sharing data, file types, protocols or updates with it.
name: Mobile (Windows)
on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile-windows.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile-windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Core tests + MSIX
    runs-on: windows-2022 # VS 2022: the v143 toolset the WinUI 3 project builds with (windows-latest has VS 2026 without it)
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # SQLite for the mingwX64 core (SQLDelight's native driver links it)
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-sqlite3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Core tests (mingwX64) and rejboard_core.dll
        working-directory: mobile
        shell: pwsh
        run: |
          $root = '${{ steps.msys2.outputs.msys2-location }}'
          $lib = (Join-Path $root 'mingw64\lib') -replace '\\', '/'
          $env:PATH = (Join-Path $root 'mingw64\bin') + ';' + $env:PATH   # the test executable loads libsqlite3-0.dll
          gradle :core:mingwX64Test :core:linkReleaseSharedMingwX64 "-Prb.sqliteMingwDir=$lib" --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports-windows
          path: mobile/core/build/reports/tests/
          if-no-files-found: ignore

      - name: Stage the core for Visual Studio
        shell: pwsh
        run: ./mobile/windows/stage-core.ps1 -Msys2Root '${{ steps.msys2.outputs.msys2-location }}'

      - uses: microsoft/setup-msbuild@v2

      - name: Build MSIX
        working-directory: mobile/windows
        shell: pwsh
        run: |
          msbuild RejBoardNative.sln /restore /p:RestorePackagesConfig=true /p:Configuration=Release /p:Platform=x64 `
            /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageSigningEnabled=false `
            /p:GenerateAppxPackageOnBuild=true /p:AppxSymbolPackageEnabled=false /p:AppxPackageDir=$PWD\AppPackages\ /m /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # A throw-away test certificate per run, so the MSIX can be sideloaded. Its .cer is in the artifact:
      # trust it once (Local Machine > Trusted People), then double-click the .msix.
      - name: Sign MSIX with a test certificate
        working-directory: mobile/windows
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=Rejwan Shafi' -KeyUsage DigitalSignature `
            -FriendlyName 'RejBoard Native CI test certificate' -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pass = [guid]::NewGuid().ToString()
          $secure = ConvertTo-SecureString -String $pass -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\ci.pfx" -Password $secure | Out-Null
          Export-Certificate -Cert $cert -FilePath AppPackages\RejBoardNative-test-certificate.cer | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $msix = Get-ChildItem AppPackages -Recurse -Filter *.msix | Where-Object { $_.FullName -notmatch '\\Dependencies\\' }
          if (-not $msix) { throw 'no .msix was produced' }
          foreach ($m in $msix) {
            & $signtool.FullName sign /fd SHA256 /f "$env:RUNNER_TEMP\ci.pfx" /p $pass $m.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Remove-Item "$env:RUNNER_TEMP\ci.pfx"
          Get-ChildItem AppPackages -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      # The package folder Visual Studio makes (RejBoardNative_<ver>_x64_Test: .msix, Add-AppDevPackage.ps1, Install.ps1,
      # Dependencies), trimmed to what an install needs: no .msixsym debug symbols, no x86/ARM64 dependencies (the
      # artifact was 122 MB with them). The test certificate goes INSIDE that folder, next to the .msix:
      # Add-AppDevPackage.ps1 looks for the .cer in its own folder ("No certificate found in the script directory").
      - name: Stage the artifact
        working-directory: mobile/windows
        shell: pwsh
        run: |
          $msix = Get-ChildItem AppPackages -Recurse -Filter *.msix | Where-Object { $_.FullName -notmatch '\\Dependencies\\' } | Select-Object -First 1
          if (-not $msix) { throw 'no .msix was produced' }
          $pkg = $msix.Directory
          $out = New-Item -ItemType Directory -Force -Path artifact
          $dest = Join-Path $out $pkg.Name
          Copy-Item $pkg.FullName $dest -Recurse
          Get-ChildItem $dest -Recurse -Include *.msixsym, *.appxsym | Remove-Item -Force
          $depRoot = Join-Path $dest 'Dependencies'
          if (Test-Path $depRoot) {
            Get-ChildItem $depRoot -Directory | Where-Object { $_.Name -ne 'x64' } | Remove-Item -Recurse -Force
          }
          Copy-Item AppPackages\RejBoardNative-test-certificate.cer $dest
          @(
            'RejBoard Native (preview) for Windows',
            "Easiest: right-click $($pkg.Name)\Install.ps1 > Run with PowerShell (it trusts the test certificate and installs the runtime and the app).",
            'By hand:',
            '1. Import RejBoardNative-test-certificate.cer into Local Machine > Trusted People (once per CI build).',
            '2. If Windows asks for the Windows App Runtime, install the package in Dependencies\x64 first.',
            '3. Double-click the .msix.'
          ) | Set-Content -Encoding utf8 (Join-Path $out 'INSTALL.txt')
          Get-ChildItem $out -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: RejBoardNative-windows-msix
          path: mobile/windows/artifact/
          if-no-files-found: error
